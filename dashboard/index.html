<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0a192f] text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function LoginPage({ onLogin }) {
      const [isSignUp, setIsSignUp] = useState(false);

      return (
        <div className="flex items-center justify-center min-h-screen bg-[#0a192f]">
          <div className="bg-gray-900 text-white p-8 rounded-2xl shadow-lg w-full max-w-md">
            <h2 className="text-3xl font-bold mb-6 text-center">
              {isSignUp ? "Sign Up" : "Login"}
            </h2>
            <form className="space-y-4">
              {isSignUp && (
                <input
                  type="text"
                  placeholder="Full Name"
                  className="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none"
                />
              )}
              <input
                type="email"
                placeholder="Email"
                className="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none"
              />
              <input
                type="password"
                placeholder="Password"
                className="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none"
              />
              <button
                type="button"
                onClick={onLogin}
                className="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg font-bold transition"
              >
                {isSignUp ? "Sign Up" : "Login"}
              </button>
            </form>
            <p
              className="text-center mt-4 text-sm cursor-pointer text-blue-400 hover:underline"
              onClick={() => setIsSignUp(!isSignUp)}
            >
              {isSignUp
                ? "Already have an account? Login"
                : "Don't have an account? Sign Up"}
            </p>
          </div>
        </div>
      );
    }

    function ProfileModal({ onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60">
          <div className="bg-gray-900 text-white p-8 rounded-2xl shadow-xl max-w-lg w-full relative">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 text-gray-400 hover:text-white"
            >
              ✖
            </button>
            <h2 className="text-2xl font-bold mb-4">User Profile</h2>
            <div className="space-y-4">
              <div>
                <h3 className="font-semibold">Daily Progress</h3>
                <div className="w-full bg-gray-800 rounded-full h-3">
                  <div className="bg-blue-600 h-3 rounded-full w-2/3"></div>
                </div>
                <p className="text-sm text-gray-400 mt-1">65% completed today</p>
              </div>
              <div>
                <h3 className="font-semibold">Course Completion</h3>
                <div className="w-full bg-gray-800 rounded-full h-3">
                  <div className="bg-green-500 h-3 rounded-full w-1/2"></div>
                </div>
                <p className="text-sm text-gray-400 mt-1">50% of total courses completed</p>
              </div>
              <div>
                <h3 className="font-semibold">Personal Details</h3>
                <p className="text-sm text-gray-400">Name: Bharath</p>
                <p className="text-sm text-gray-400">Email: Bharath@example.com</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Dashboard() {
      const courses = [
        {
          id: 1,
          title: "React Basics",
          description: "Learn about components, props, and state in React to build your first dynamic web applications.",
          icon: "⚛"
        },
        {
          id: 2,
          title: "JavaScript Essentials",
          description: "Understand variables, functions, arrays, and objects—must-have knowledge for any developer.",
          icon: "📜"
        },
        {
          id: 3,
          title: "Tailwind CSS",
          description: "Style your apps efficiently with utility-first CSS classes and design beautiful interfaces directly in markup.",
          icon: "🎨"
        },
      ];

      const [selectedCourse, setSelectedCourse] = useState(null);
      const [showProfile, setShowProfile] = useState(false);

      return (
        <div className="min-h-screen bg-[#0a192f] text-white p-6 sm:p-12 font-sans">
          <div className="w-full max-w-7xl mx-auto flex flex-col items-center">
            <div className="flex justify-between items-center w-full mb-8">
              <h1 className="text-4xl sm:text-5xl font-extrabold">Your Dashboard</h1>
              <button
                onClick={() => setShowProfile(true)}
                className="bg-blue-600 px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition"
              >
                Profile
              </button>
            </div>

            <p className="text-lg text-center mb-10 text-gray-300 max-w-2xl">
              Click on a course card to learn more and start your quiz.
            </p>

            {/* Courses List */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl">
              {courses.map((course) => (
                <div
                  key={course.id}
                  onClick={() => setSelectedCourse(course)}
                  className="bg-gray-900 rounded-3xl p-6 cursor-pointer transform transition-all duration-300 shadow-lg border border-gray-800 hover:scale-[1.05] hover:shadow-2xl"
                >
                  <div className="text-5xl">{course.icon}</div>
                  <h2 className="text-2xl font-bold mt-4 mb-2">{course.title}</h2>
                  <p className="text-gray-400 text-sm">{course.description}</p>
                </div>
              ))}
            </div>

            {/* Course Details */}
            {selectedCourse && (
              <div className="relative mt-12 w-full max-w-4xl bg-gray-900 rounded-3xl p-8 shadow-xl border border-gray-800 transition-all">
                <button
                  onClick={() => setSelectedCourse(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white"
                >
                  ✖
                </button>
                <div className="flex items-center mb-4 text-4xl">
                  {selectedCourse.icon}
                  <h2 className="text-3xl font-bold ml-4">{selectedCourse.title}</h2>
                </div>
                <p className="text-gray-300 leading-relaxed mb-6">
                  {selectedCourse.description}
                </p>
                <button
                  className="bg-blue-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:bg-blue-700 transition"
                >
                  Start Quiz
                </button>
              </div>
            )}
          </div>

          {/* Profile Modal */}
          {showProfile && <ProfileModal onClose={() => setShowProfile(false)} />}
        </div>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      return isLoggedIn ? (
        <Dashboard />
      ) : (
        <LoginPage onLogin={() => setIsLoggedIn(true)} />
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
